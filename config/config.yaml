# RailBlock AI — global configuration
# Every invented number here has a row in ASSUMPTIONS.md. Keep them in sync.

seed: 20260923

corridors:                # config/network/<name>.yaml ; add a file = add a corridor (SPEC §4)
  - central_line
  - western_line
  - harbour_line
  - trans_harbour

data:
  sourcing_time_cap_min: 90        # SPEC §3.2 hard cap, then synthetic fallback
  mode: auto                       # auto | real | synthetic
  raw_dir: data/raw
  processed_dir: data/processed
  service_date: "2026-09-21"       # a Monday — planned tasks are finalised Mondays (SPEC §5.4)
  week_days: 7

validation:
  min_headway_s: 120               # V5
  min_dwell_s: 20                  # V3
  max_dwell_s: 1200                # V3
  min_implied_speed_kmph: 15       # V4
  runtime_warn_pct: 0.5            # V4 verdict threshold, as a share of hops
  max_calibrated_speed_kmph: 130   # ceiling when raising a limit from evidence
  max_services_per_day_warn: 2000
  min_services_per_day: 200        # V7
  occupancy_tolerance_min: 1       # V10
  residual_warn_pct: 0.5           # V5: residual sub-headway events below this
                                   # share of traversals are WARN, not FAIL (A-011)
  block_on_fail: true              # API and demo.py refuse to run on FAIL (SPEC §3.4)

delays:                            # SPEC §3.6 — synthetic fallback distributions
  enabled: true
  suburban:   {dist: gamma, mean_min: 2.5,  shape: 1.6, p_gt_10min: 0.04}
  intercity:  {dist: gamma, mean_min: 12.0, shape: 1.2, p_gt_10min: 0.35}
  freight:    {dist: gamma, mean_min: 35.0, shape: 0.9, p_gt_10min: 0.62}
  peak_multiplier: 1.6
  peak_windows: [["07:00", "11:00"], ["17:00", "21:00"]]

track_status:                      # SPEC §5.2
  sick_speed_kmph: 30
  caution_speed_kmph: 30
  stop_and_start_penalty_s: 240

gaps:                              # SPEC §6.3
  block_setup_min: 15
  block_release_min: 10
  power_block_extra_min: 10
  min_usable_gap_min: 20
  min_workable_min: 15             # every window must leave at least this much real work time
  headway_buffer_s: 120
  lookout_min: 5                   # the gang must be clear of the track this long before the next train
  block_grid_min: 5                # blocks are granted in whole 5-minute steps (A-041)

station_tiers:                     # SPEC §8.1 — quantile-derived, not hardcoded
  tier1_quantile: 0.80
  tier3_quantile: 0.35
  max_window_min_tier1: 45
  max_window_min_tier2: 120
  max_window_min_tier3: 240
  max_concurrent_blocks_tier1: 1
  max_concurrent_blocks_tier2: 2
  max_concurrent_blocks_tier3: 2

rerouting:                         # SPEC §9
  k_alternate_paths: 3
  max_delay_min:
    INTERCITY: 30
    FREIGHT_MAIL: 90
    SUBURBAN_LOCAL: 0              # never rerouted — enforced by assertion, not by this number
  max_single_line_min: 180
  max_concurrent_single_line_sections: 2

tasks:
  planned_due_hours: 168           # planned work is due within the week it is issued
  demand_due_hours: 24             # unplanned defects are due inside a day
  followup_due_hours: 72           # a restricted section must be cleared within 3 days

departments:
  gangs_per_department: 2          # concurrent work gangs per department per corridor
  iwp_quota_per_day: 2             # Integrated Work Permission daily quota (SPEC §7.2 R1)

planner:                           # SPEC §10
  max_blocks_per_day: 8            # blocks the division can protect and supervise in a day
  solve_time_s_demo: 60
  solve_time_s_instance: 10
  num_search_workers: 8
  weights:
    w1_train_minutes_lost: 1.0     # primary operational cost
    w2_unscheduled_task: 100.0     # per priority-point, per task left unplanned.
                                   # MUST exceed w3 x horizon_days (6 x 7 = 42), otherwise
                                   # scheduling late costs more than never scheduling and the
                                   # solver rationally abandons work it could have done.
    w3_degraded_status_hours: 6.0  # CAUTION_ORDER / STOP_AND_START section-hours
    w4_rerouted_train_delay: 0.8
    w5_single_line_minutes: 0.5
    w6_iwp_usage: 25.0             # administratively expensive; use sparingly
    w7_micro_gap_bonus: 15.0       # deliberate: we want micro-gap usage (SPEC §10.3)
    w8_integrated_block: 6.0       # reward per compatible cross-department pair sharing a block
    w9_pax_exposure: 1.0           # cost per 1,000 passenger-hours within reach of a job (A-040)
    w10_fragile_window: 6.0        # cost of a window with no spare time or a shaky start (A-043)
    w11_churn: 0.0                 # cost per existing job moved by a re-plan; the assistant sets it (A-044)

rl:                                # SPEC §11-§12
  n_instances: 500
  min_instances: 200
  horizon_hours: 24
  max_tasks_in_state: 20
  max_windows_in_state: 12
  hidden_dim: 256
  lr: 3.0e-4
  batch_size: 256
  grad_steps: 60000
  cql_alpha: 5.0
  split: {train: 0.70, val: 0.15, test: 0.15}

metrics:                           # SPEC §15.1 — baseline model parameters
  manual_coordination_hours_per_conflict: 4.0
  manual_replan_wait_days: 7

adapters:
  mode: mock                       # mock | live

clustering:                        # backend/planner/clustering.py (ASSUMPTIONS A-029)
  cut_km: 5.0                      # average-linkage distance at which job groups stop merging
  method: average                  # average | kmedoids (K-Medoids chooses its group count by silhouette)
  priority_km: 2.0                 # one priority step counts as this many km when grouping: near AND similarly urgent (A-054)
  small_job_min: 45                # a job this short or shorter can ride in a bigger job's block (A-054)
  rider_priority_gap: 1            # ... if it is within this many priority steps of the big job (A-054)

aging:                             # backend/planner/aging.py (ASSUMPTIONS A-059)
  enabled: true
  hours_per_step: 48               # a job moves up one priority level for every 48 h it waits ...
  floor: 2                         # ... but never above P2, so routine work cannot outrank a P1 emergency

daily:                             # backend/planner/dayfill.py (ASSUMPTIONS A-055)
  jobs_per_day: 4                  # standing routine jobs raised each day
  max_job_min: 45                  # longest routine job
  from_hour: 4                     # they are placed from this hour to the end of the day
  days: 7

reclaim:                           # backend/planner/reclaim.py (ASSUMPTIONS A-053)
  backlog_jobs: 240                # small as-and-when jobs waiting across the network
  max_job_min: 60                  # longest job that counts as small enough to fill freed time
  seeds: 12                        # random weeks averaged

gap_creation:                      # backend/gaps/creation.py (ASSUMPTIONS A-032)
  max_hold_min: 4                  # longest any one train may be held to widen a gap
  max_total_delay_min: 30          # train-minutes one created gap may cost, cascade included
  survey_max_deficit_min: 12       # how far short of workable a gap may be and still be widened
  single_line_max_hold_min: 8      # longest a train may wait when a section runs single-line
  single_line_max_total_min: 60    # train-minutes single-line working may cost for one window
  max_reroutes_per_gap: 4          # long-distance/freight trains that may be diverted for one gap

pax:                               # backend/domain/pax.py (ASSUMPTIONS A-040)
  peak_pax_local: 3000             # people on one suburban train at the busiest hour
  peak_pax_intercity: 1000
  margin_min: 30                   # services this close before/after a job count as within reach
  score_per_1000: 1.0              # live scheduler: one hour of waiting == this many thousand people

sudden:                            # backend/planner/sudden.py (ASSUMPTIONS A-042)
  due_hours: {1: 2, 2: 6, 3: 24, 5: 72}   # by priority: critical, high, medium, low
  max_bumped: 2                    # planned jobs one sudden task may push aside
  emergency_max_train_min: 3000    # train-minutes a critical fault's emergency block may cost (P1; P2 gets two thirds)
  emergency_lead_min: 10           # time to get a gang and protection to site

robustness:                        # backend/planner/robustness.py (ASSUMPTIONS A-043)
  overrun_sigma: 0.15              # spread of how long work really takes against its plan (lognormal)

weather:                           # backend/planner/crew_profile.py (ASSUMPTIONS A-045)
  rain_days: [1, 2]                # days of the week forecast wet (0 = Monday); synthetic

twin:                              # backend/planner/twin.py (ASSUMPTIONS A-046)
  horizon_h: 12                    # how far ahead the ripple is followed
  scenarios: 30                    # random days per response
  recovery_s_per_hop: 30           # delay a train wins back at each section (timetable slack)
  cancel_after_min: 90             # a train later than this is cancelled or short-terminated: its delay stops counting
  lateness_scale: 0.3              # share of the configured random lateness applied, so the closure's own effect dominates

predictive:                        # backend/planner/predictive.py and forecast.py (ASSUMPTIONS A-047, A-048)
  p_detect: 0.8                    # assumed share of failures an inspection system warns of in advance
  warnings: 40                     # simulated monitoring warnings over the week
  act_threshold: 0.3               # plan a proactive block only for warnings at or above this risk (a setting; the sweep shows the alternatives)
  max_blocks_per_day: 6            # proactive blocks in one day: about the routine plan's own daily load (40 jobs / 7 days)
  max_blocks_per_section_day: 1    # one crew visit per section per day covers every flagged asset there

chat:                              # backend/chat/whatif.py: other names people use for a station
  aliases:
    "Mumbai CSMT": ["csmt", "cst", "victoria terminus"]
    "Mumbai Central": ["bombay central"]
    "Belapur CBD": ["belapur", "cbd belapur"]
    "Vasai Road": ["vasai"]
    "Bhivpuri Road": ["bhivpuri"]
    "Seawoods-Darave": ["seawoods"]
    "Dadar (W)": ["dadar western", "dadar west"]
    "Koparkhairane": ["kopar khairane"]
    "Lower Parel": ["parel"]
    "Prabhadevi": ["elphinstone", "elphinstone road"]
    "Mansarovar": ["mansarover"]

resources:                         # backend/planner/resource_plan.py (ASSUMPTIONS A-057)
  machines: {tamping_machine: 1, ballast_cleaning_machine: 1, tower_wagon: 2}   # machines available to the whole corridor
  machine_speed_kmph: 25           # a machine travelling between sections
  machine_shunt_min: 15            # fixed time to get a machine on or off the track

learning:                          # backend/planner/learning.py (ASSUMPTIONS A-058)
  prior_weight: 5                  # the neutral prior counts as this many past jobs
  min_n: 10                        # below this many logged jobs in a group, fall back to the spread of all logged jobs
