# Master Configuration for RailBlock AI
seed: 42

# Time Budgets & Solver Settings
cpsat:
  max_time_in_seconds: 60
  expert_gen_time_in_seconds: 10
  num_search_workers: 8
  random_seed: 42

# Gap Engine Overhead & Buffers
gaps:
  headway_buffer_s: 120
  block_setup_min: 15
  block_release_min: 10
  power_block_extra_min: 10
  min_usable_gap_min: 20

# Objective Weights (w1 to w7)
objective_weights:
  w1_train_minutes_lost: 10.0
  w2_unscheduled_task_penalty: 50.0
  w3_degraded_status_section_hours: 15.0
  w4_rerouted_train_delay: 5.0
  w5_single_line_working_minutes: 8.0
  w6_iwp_usage: 20.0
  w7_micro_gap_utilisation_bonus: 30.0

# Operational Resource Caps & Constraints
resources:
  iwp_quota_per_day: 2
  max_single_line_min: 180
  max_concurrent_single_line_sections: 2
  gang_capacity_per_dept: 2

# Station Tier Sizing Parameters
station_tiers:
  tier1_max_window_min: 45
  tier3_max_window_min: 180

# Track Status Speeds & Penalties
track_status:
  fit_speed_kmph: 100
  sick_speed_kmph: 30
  caution_speed_kmph: 30
  stop_and_start_penalty_s: 240

# Government System Adapters Mode
adapters:
  mode: "mock" # options: mock | live
