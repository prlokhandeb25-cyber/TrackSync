# Central Railway (Harbour) — Mumbai CSMT → Panvel
# coord_src: d = public stations dataset, s = supplied by us (A-024).

corridor_id: harbour_line
name: Harbour Line (CSMT – Panvel)
line_code: HR
zone: CR
division: Mumbai
route_factor: 1.14

megablock:
  day_of_week: SUN
  start: "10:00"
  end: "15:00"

defaults:
  tracks: [UP, DN]                 # the Harbour line is a two-track railway throughout
  line_speed_kmph: 80
  track_policy:
    SUBURBAN_LOCAL: [UP, DN]
    INTERCITY:      [UP, DN]
    FREIGHT_MAIL:   [UP, DN]

stations:
  - {code: CSTM, name: Mumbai CSMT,      lat: 18.944481, lon: 72.836903, platforms: 18, junction: true,  coord_src: d, expect_tier: TIER_1}
  - {code: MSD,  name: Masjid,           lat: 18.952385, lon: 72.838561, platforms: 4, junction: false, coord_src: d, expect_tier: TIER_2}
  - {code: SNRD, name: Sandhurst Road,   lat: 18.962311, lon: 72.839733, platforms: 4, junction: true,  coord_src: d, expect_tier: TIER_2}
