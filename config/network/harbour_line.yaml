section_overrides:
  CSTM-MSD: {line_speed_kmph: 50}
  MSD-SNRD: {line_speed_kmph: 50}
  MNKD-VSH: {line_speed_kmph: 90}   # the Vashi creek bridge section

suburban:
  enabled: true
  services_per_day: 620
  first_up: "04:05"
  last_down: "00:30"
  peak_windows: [["07:30", "11:00"], ["17:00", "21:00"]]
  peak_headway_min: [5, 9]
  offpeak_headway_min: [12, 20]
  dwell_s: 22
  patterns:
    - {from: CSTM, to: PNVL, share: 0.38}
    - {from: CSTM, to: VSH,  share: 0.24}
    - {from: CSTM, to: BEPR, share: 0.20}
    - {from: CSTM, to: MNKD, share: 0.18}

long_distance:
  enabled: true
  source: data/raw/schedules.json
  min_corridor_stations: 3
  freight_share: 0.30
  freight_band: ["00:45", "04:15"]

allotments:
  PWI:
    [CSTM-MSD, MSD-SNRD, SNRD-DKRD, DKRD-RRD, RRD-CTGN, CTGN-SVE, SVE-VDLR, VDLR-GTBN,
     GTBN-CHF, CHF-CLA, CLA-TNR, TNR-CMBR, CMBR-GV, GV-MNKD, MNKD-VSH, VSH-SNPD, SNPD-JNJ,
     JNJ-NEU, NEU-SWDW, SWDW-BEPR, BEPR-KHAG, KHAG-MSRV, MSRV-KNDS, KNDS-PNVL]
  OWD:
    [CSTM-MSD, MSD-SNRD, SNRD-DKRD, DKRD-RRD, RRD-CTGN, CTGN-SVE, SVE-VDLR, VDLR-GTBN,
     GTBN-CHF, CHF-CLA, CLA-TNR, TNR-CMBR, CMBR-GV, GV-MNKD, MNKD-VSH, VSH-SNPD, SNPD-JNJ,
     JNJ-NEU, NEU-SWDW, SWDW-BEPR]
  S_AND_T:
    [CSTM-MSD, MSD-SNRD, SNRD-DKRD, DKRD-RRD, RRD-CTGN, CTGN-SVE, SVE-VDLR, VDLR-GTBN,
     GTBN-CHF, CHF-CLA, CLA-TNR, TNR-CMBR, CMBR-GV, GV-MNKD, MNKD-VSH, VSH-SNPD, SNPD-JNJ,
