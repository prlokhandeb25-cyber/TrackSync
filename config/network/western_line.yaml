# Western Railway — Churchgate → Virar
#
# coord_src: d = taken from the public stations dataset, s = supplied by us.
# The national dataset only carries stations that long-distance trains call at, so pure
# suburban halts are absent from it and their coordinates are ours. Tracked per station so
# the provenance claim stays honest (ASSUMPTIONS A-024).

corridor_id: western_line
name: Western Line (Churchgate – Virar)
line_code: WR
zone: WR
division: Mumbai
route_factor: 1.12

megablock:
  day_of_week: SUN
  start: "11:00"
  end: "16:00"

defaults:
  tracks: [UP_SLOW, DN_SLOW, UP_FAST, DN_FAST]
  line_speed_kmph: 100
  track_policy:
    SUBURBAN_LOCAL: [UP_SLOW, DN_SLOW]
    INTERCITY:      [UP_FAST, DN_FAST]
    FREIGHT_MAIL:   [UP_SLOW, DN_SLOW]

stations:
  - {code: CCG,  name: Churchgate,       lat: 18.932200, lon: 72.826400, platforms: 9, junction: true,  coord_src: s, expect_tier: TIER_1}
  - {code: MEL,  name: Marine Lines,     lat: 18.945500, lon: 72.823700, platforms: 4, junction: false, coord_src: s, expect_tier: TIER_2}
  - {code: CYR,  name: Charni Road,      lat: 18.951400, lon: 72.819500, platforms: 4, junction: false, coord_src: s, expect_tier: TIER_2}
  - {code: GTR,  name: Grant Road,       lat: 18.962700, lon: 72.815300, platforms: 4, junction: false, coord_src: s, expect_tier: TIER_2}
  - {code: BCT,  name: Mumbai Central,   lat: 18.970667, lon: 72.819383, platforms: 9, junction: true,  coord_src: d, expect_tier: TIER_1}
  - {code: MX,   name: Mahalaxmi,        lat: 18.982500, lon: 72.823200, platforms: 4, junction: false, coord_src: s, expect_tier: TIER_2}
  - {code: PL,   name: Lower Parel,      lat: 18.994919, lon: 72.829620, platforms: 4, junction: false, coord_src: d, expect_tier: TIER_2}
  - {code: EPR,  name: Prabhadevi,       lat: 19.006940, lon: 72.835426, platforms: 4, junction: false, coord_src: d, expect_tier: TIER_2}
  - {code: DDR,  name: Dadar (W),        lat: 19.018700, lon: 72.843400, platforms: 6, junction: true,  coord_src: s, expect_tier: TIER_1}
  - {code: MRU,  name: Matunga Road,     lat: 19.028606, lon: 72.847143, platforms: 4, junction: false, coord_src: d, expect_tier: TIER_2}
  - {code: MM,   name: Mahim Jn,         lat: 19.041000, lon: 72.841000, platforms: 4, junction: true,  coord_src: s, expect_tier: TIER_2}
  - {code: BA,   name: Bandra,           lat: 19.054454, lon: 72.840454, platforms: 6, junction: true,  coord_src: d, expect_tier: TIER_1}
  - {code: KHAR, name: Khar Road,        lat: 19.070500, lon: 72.839800, platforms: 4, junction: false, coord_src: s, expect_tier: TIER_2}
  - {code: STC,  name: Santacruz,        lat: 19.081000, lon: 72.841500, platforms: 4, junction: false, coord_src: s, expect_tier: TIER_2}
