  - {code: VR,   name: Virar,            lat: 19.454407, lon: 72.811737, platforms: 6, junction: true,  coord_src: d, expect_tier: TIER_2}

section_overrides:
  CCG-MEL: {line_speed_kmph: 60}
  MEL-CYR: {line_speed_kmph: 60}
  BSR-NSP: {tracks: [UP, DN]}
  NSP-VR:  {tracks: [UP, DN]}

suburban:
  enabled: true
  services_per_day: 1300
  first_up: "04:00"
  last_down: "01:05"
  peak_windows: [["07:30", "11:00"], ["17:00", "21:30"]]
  peak_headway_min: [3, 5]
  offpeak_headway_min: [7, 14]
  dwell_s: 25
  patterns:
    - {from: CCG, to: BVI,  share: 0.30}
    - {from: CCG, to: ADH,  share: 0.22}
    - {from: CCG, to: VR,   share: 0.18}
    - {from: CCG, to: BYR,  share: 0.12}
    - {from: CCG, to: BA,   share: 0.10}
    - {from: CCG, to: BSR,  share: 0.08}

long_distance:
  enabled: true
  source: data/raw/schedules.json
  min_corridor_stations: 3
  freight_share: 0.18
  freight_band: ["01:00", "04:30"]

allotments:
  PWI:
    [CCG-MEL, MEL-CYR, CYR-GTR, GTR-BCT, BCT-MX, MX-PL, PL-EPR, EPR-DDR, DDR-MRU, MRU-MM,
     MM-BA, BA-KHAR, KHAR-STC, STC-VLP, VLP-ADH, ADH-JOS, JOS-GMN, GMN-MDD, MDD-KILE,
     KILE-BVI, BVI-DIC, DIC-MIRA, MIRA-BYR, BYR-NIG, NIG-BSR, BSR-NSP, NSP-VR]
  OWD:
    [CCG-MEL, MEL-CYR, CYR-GTR, GTR-BCT, BCT-MX, MX-PL, PL-EPR, EPR-DDR, DDR-MRU, MRU-MM,
     MM-BA, BA-KHAR, KHAR-STC, STC-VLP, VLP-ADH, ADH-JOS, JOS-GMN, GMN-MDD, MDD-KILE,
     KILE-BVI, BVI-DIC, DIC-MIRA, MIRA-BYR, BYR-NIG, NIG-BSR]
  S_AND_T:
    [CCG-MEL, MEL-CYR, CYR-GTR, GTR-BCT, BCT-MX, MX-PL, PL-EPR, EPR-DDR, DDR-MRU, MRU-MM,
     MM-BA, BA-KHAR, KHAR-STC, STC-VLP, VLP-ADH, ADH-JOS, JOS-GMN, GMN-MDD, MDD-KILE,
     KILE-BVI, BVI-DIC, DIC-MIRA, MIRA-BYR, BYR-NIG, NIG-BSR, BSR-NSP, NSP-VR]
