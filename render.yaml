services:
  - type: web
    name: optisync-backend
    env: python
    region: singapore
    buildCommand: "python -m pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

